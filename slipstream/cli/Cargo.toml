[package]
name = "slipstream-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "slipstream"
path = "src/main.rs"

[features]
# Passthrough so `cargo run -p slipstream-cli --features gpu` enables the GPU Orchard
# subtree build in slipstream-core. Without it, --gpu-subtree / --gpu-subtree-b would
# silently fall back to the CPU path (a false IDENTICAL); main.rs guards against that.
gpu = ["slipstream-core/gpu"]

[dependencies]
slipstream-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }
rand = { workspace = true }
