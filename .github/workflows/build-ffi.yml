name: Build FFI XCFramework

on:
  # Manual trigger for preparing releases.
  # The branch selected in the GitHub UI determines which commit is checked out and built.
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version (e.g., 2.5.0)'
        required: true
      slipstream:
        description: 'Also build/upload the ZODL Slipstream (AGPL) variant artifact'
        type: boolean
        default: true

permissions: {}

jobs:
  build-xcframework:
    runs-on: macos-15
    permissions:
      contents: write # Required for creating draft releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Authorize cargo against the private slipstream repository
        uses: ./.github/actions/authorize-slipstream
        with:
          app-id: ${{ secrets.SLIPSTREAM_APP_ID }}
          app-private-key: ${{ secrets.SLIPSTREAM_APP_PRIVATE_KEY }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          # `registry/` is crates.io content (zodl-slipstream is consumed as a public
          # crates.io release) and `target/` holds compiled artifacts for BOTH feature
          # variants — cargo fingerprints keep them apart within one target dir.
          path: |
            target
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v1-

      # One prepare-release.sh run builds the clean artifact (always, with the
      # AGPL purity gate) and — with --slipstream — additionally builds and
      # uploads the libzcashlc-zodl-slipstream superset artifact to the SAME
      # draft release. Sequential builds on one runner share the cargo cache.
      - name: Build and upload draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          WITH_SLIPSTREAM: ${{ github.event.inputs.slipstream }}
        run: |
          if [[ "$WITH_SLIPSTREAM" == "true" ]]; then
            ./Scripts/prepare-release.sh --slipstream "$VERSION"
          else
            ./Scripts/prepare-release.sh "$VERSION"
          fi

      - name: Output Package.swift Update
        run: |
          source BuildSupport/products/release.env
          echo ""
          echo "========================================"
          echo "Update Package.swift with:"
          echo "========================================"
          echo ""
          echo "cleanFFIURL: \"${DOWNLOAD_URL}\","
          echo "cleanFFIChecksum: \"${CHECKSUM}\""
          if [[ -n "${SLIPSTREAM_DOWNLOAD_URL:-}" ]]; then
            echo "slipstreamFFIURL: \"${SLIPSTREAM_DOWNLOAD_URL}\","
            echo "slipstreamFFIChecksum: \"${SLIPSTREAM_CHECKSUM}\""
          fi
          echo ""
          echo "Then commit, tag ${VERSION}, and publish the draft release."
