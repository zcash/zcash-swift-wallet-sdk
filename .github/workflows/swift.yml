name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

jobs:
  build:
    permissions:
      contents: read

    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        # clean: the default MIT-only product; also runs the AGPL purity gate.
        # zodl-slipstream: the opt-in AGPL variant product and its test suite.
        variant: [clean, zodl-slipstream]
        include:
          - variant: clean
            slipstream: 0
            products_dir: BuildSupport/products
          - variant: zodl-slipstream
            slipstream: 1
            products_dir: BuildSupport/products-slipstream

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_16.0.app/Contents/Developer'

    # Generate a hash of all Rust source files for cache key
    - name: Generate FFI source hash
      id: ffi-hash
      run: |
        # Hash all Rust source files, Cargo files, and build support files
        FFI_HASH=$(find rust Cargo.toml Cargo.lock BuildSupport -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.lock" -o -name "Makefile" -o -name "*.h" -o -name "*.c" -o -name "*.plist" -o -name "*.modulemap" \) -exec shasum {} \; | sort | shasum | cut -d' ' -f1)
        echo "hash=$FFI_HASH" >> $GITHUB_OUTPUT
        echo "FFI source hash: $FFI_HASH"

    # Cache the built xcframework (macOS-only for CI tests), keyed per variant.
    - name: Cache FFI XCFramework
      id: cache-ffi
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ matrix.products_dir }}/libzcashlc.xcframework
        key: ffi-xcframework-macos-only-${{ matrix.variant }}-${{ runner.os }}-${{ steps.ffi-hash.outputs.hash }}

    - name: Authorize cargo against the private slipstream repository
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      uses: ./.github/actions/authorize-slipstream
      with:
        app-id: ${{ secrets.SLIPSTREAM_APP_ID }}
        app-private-key: ${{ secrets.SLIPSTREAM_APP_PRIVATE_KEY }}

    # Only set up Rust if we need to build FFI
    - name: Setup Rust
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable
        targets: aarch64-apple-darwin, x86_64-apple-darwin

    - name: Cache Cargo
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        # `registry/` is crates.io content (zodl-slipstream is consumed as a
        # public crates.io release). `target/` is shared between variants;
        # cargo fingerprints keep the feature sets apart.
        path: |
          target
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
        key: ${{ runner.os }}-cargo-${{ matrix.variant }}-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.variant }}-v1-
          ${{ runner.os }}-cargo-v1-

    # Build FFI for macOS only (sufficient for running tests)
    - name: Build FFI for macOS
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: make ffi-macos SLIPSTREAM=${{ matrix.slipstream }}

    # Verify xcframework exists (whether from cache or fresh build)
    - name: Verify XCFramework
      run: make verify-ffi SLIPSTREAM=${{ matrix.slipstream }}

    # The default artifact must never ship AGPL code: no zodl-slipstream symbols
    # in the staticlib, no slipstream declarations left in the shipped header.
    - name: AGPL purity gate (clean variant)
      if: matrix.variant == 'clean'
      run: |
        LIB="${{ matrix.products_dir }}/libzcashlc.xcframework/macos-arm64_x86_64/libzcashlc.framework/libzcashlc"
        SYMS=$(nm -gU "$LIB" | grep -c zcashlc_slipstream || true)
        if [ "$SYMS" -ne 0 ]; then
          echo "FATAL: clean libzcashlc exports $SYMS zcashlc_slipstream symbol(s)"; exit 1
        fi
        HEADER="${{ matrix.products_dir }}/libzcashlc.xcframework/macos-arm64_x86_64/libzcashlc.framework/Headers/zcashlc.h"
        if grep -q ZCASHLC_FEATURE_SLIPSTREAM "$HEADER"; then
          echo "FATAL: clean header still references ZCASHLC_FEATURE_SLIPSTREAM"; exit 1
        fi
        echo "Clean artifact verified: zero slipstream symbols, header fully stripped."

    # Set up LocalPackages so Package.swift auto-detects the local build; also
    # maintains the .zodl-slipstream-variant marker for the target graph.
    - name: Configure local FFI for CI
      run: make configure-local-ffi SLIPSTREAM=${{ matrix.slipstream }}

    # Build the Swift package
    - name: Build ZcashLightClientKit Swift Package
      timeout-minutes: 15
      run: make build SWIFT_BUILD_FLAGS=-v

    # Run tests
    - name: Run OfflineTests suite
      if: matrix.variant == 'clean'
      timeout-minutes: 10
      run: make test-offline

    - name: Run SlipstreamOfflineTests suite
      if: matrix.variant == 'zodl-slipstream'
      timeout-minutes: 10
      run: make test-offline-slipstream
