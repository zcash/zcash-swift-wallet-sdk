name: Build and Run Offline Tests

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'responsible_disclosure.md'
      - 'SWIFTLINT.md'
      - 'docs/**'

jobs:
  build:
    permissions:
      contents: read

    runs-on: macos-15

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
      timeout-minutes: 1

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_16.0.app/Contents/Developer'

    - name: Run release-script tests
      run: make test-scripts

    # Generate a hash of all Rust source files for cache key
    - name: Generate FFI source hash
      id: ffi-hash
      run: |
        # Hash all Rust source files, Cargo files, and build support files
        FFI_HASH=$(find rust Cargo.toml Cargo.lock BuildSupport -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.lock" -o -name "Makefile" -o -name "*.h" -o -name "*.c" -o -name "*.plist" -o -name "*.modulemap" \) -exec shasum {} \; | sort | shasum | cut -d' ' -f1)
        echo "hash=$FFI_HASH" >> $GITHUB_OUTPUT
        echo "FFI source hash: $FFI_HASH"

    # Cache the built xcframework (macOS-only for CI tests)
    - name: Cache FFI XCFramework
      id: cache-ffi
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: BuildSupport/products/libzcashlc.xcframework
        key: ffi-xcframework-macos-only-${{ runner.os }}-${{ steps.ffi-hash.outputs.hash }}

    # Needed unconditionally: even on an FFI cache hit, the Rust test step below
    # compiles the crate's test profile and so needs the toolchain.
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: stable
        targets: aarch64-apple-darwin, x86_64-apple-darwin

    # Cache Cargo dependencies (used by both the FFI build and the Rust tests)
    - name: Cache Cargo
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        # Deliberately enumerated rather than caching `~/.cargo` wholesale (which is what
        # Swatinem/rust-cache did): that includes `~/.cargo/git`, so a fork PR restoring a cache
        # created on the base branch could reach whatever any future git dependency was cloned
        # from. Every path below is crates.io content or this repository's own build output.
        path: |
          target
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/registry/src
        key: ${{ runner.os }}-cargo-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-v1-

    # Build FFI for macOS only (sufficient for running tests)
    - name: Build FFI for macOS
      if: steps.cache-ffi.outputs.cache-hit != 'true'
      timeout-minutes: 60
      run: make ffi-macos

    # Verify xcframework exists (whether from cache or fresh build)
    - name: Verify XCFramework
      run: make verify-ffi

    # The Rust unit tests cover the FFI layer below the Swift package, so no
    # `swift test` filter reaches them. Without this step a failing Rust test
    # can sit on a branch indefinitely.
    - name: Run Rust unit tests
      timeout-minutes: 30
      run: make test-rust

    # Set up LocalPackages so Package.swift auto-detects the local build
    - name: Configure local FFI for CI
      run: make configure-local-ffi

    # Build the Swift package
    - name: Build ZcashLightClientKit Swift Package
      timeout-minutes: 15
      run: make build SWIFT_BUILD_FLAGS=-v

    # Run tests
    - name: Run OfflineTests suite
      timeout-minutes: 10
      run: make test-offline
