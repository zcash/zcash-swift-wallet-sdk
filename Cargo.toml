[package]
name = "libzcashlc"
version = "2.8.0-rc.2"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15" }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.7", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.8", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = { version = "0.10.2", features = ["local-consensus"] }
zcash_pool_migration = { version = "0.1.0-rc.7", features = ["wallet"] }
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.9", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.7"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting
zcash_voting = { version = "=3.0.0-rc.3" }
zeroize = "1"

# Used by the pool-migration engine as well as by voting.
zcash_keys = { version = "0.16.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.8", default-features = false }

# Slipstream engine — the alternative sync engine the SlipstreamSynchronizer
# drives. Consumed as a remote crate from zodl-inc/slipstream, the engine's
# home since the personal-fork era (the old PR #6 adaptations are merged
# there). Return to a release tag once one is cut with these aboard.
#
# The rev rides [patch.crates-io] below, pinned to a COMMIT HASH rather than a
# branch: a branch pin silently follows a force-push, so a build can pick up
# code nobody reviewed, whereas a stale hash fails loudly. The engine rides the
# same librustzcash rev as this package, so the graph stays a single family
# instance.
slipstream-core = { version = "0.1", package = "zodl-slipstream" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

# GPU-accelerated Orchard subtree building in the engine (wgpu). OFF by
# default — the released libzcashlc links zero wgpu. Enable for local device
# builds via Scripts/init-local-ffi.sh --gpu / rebuild-local-ffi.sh --gpu.
gpu = ["slipstream-core/gpu"]

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# The slipstream engine has no crates.io release, so it rides a pinned rev of its canonical
# repo — a COMMIT HASH rather than a branch: a branch pin silently follows a force-push, so a
# build can pick up code nobody reviewed, whereas a stale hash fails loudly. Keep it in step with
# the librustzcash generation the versions above declare: a rev built against an older generation
# cannot resolve against them.
slipstream-core = { git = "https://github.com/zodl-inc/slipstream-internal.git", rev = "ab89ada45f2ef893a05fcefa0ead99f87d848a4e" }

# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
pczt = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "13ce6c4ef57a6c7e8837d797d85112ae16ac7455" }

