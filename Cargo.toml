[package]
name = "libzcashlc"
version = "2.5.1"
authors = [
    "Jack Grigg <thestr4d@gmail.com>",
    "Lukas Korba <lukas@tangiblecodes.com>",
    "Kris Nuttycombe<kris@nutty.land>",
    "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.9", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-blocking",
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.29"
zcash_proofs = "0.29"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.8.0-rc.1", features = ["prover"] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Voting
zcash_voting = "1.0.0"
zcash_keys = { version = "0.15", features = ["orchard"] }

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
voting-circuits = { git = "https://github.com/zodl-inc/voting-circuits.git", rev = "a5aae410a6fb14fcbea2f0ce3393035195e86f69" }
imt-tree = { git = "https://github.com/zodl-inc/vote-nullifier-pir.git", rev = "0dea3485429c80033e67a1ddb18ee72cc450cefb" }
zcash_voting = { git = "https://github.com/zodl-inc/zcash_voting.git", rev = "464f974865f2afa82bdac15d169168c77ecb9c74" }

# Pin the whole librustzcash stack to a single source, pending a crates.io release.
# zcash_voting no longer hard-pins librustzcash (it declares crates.io versions and
# patches from its own root), so this workspace's patch governs the source for the
# entire graph and everything resolves to one copy. Bump this in one place to advance
# the stack.
#
# The stack needs BOTH librustzcash main at 4faf8711 (the previous pin: Ironwood
# historical note selection, which the pinned zcash_voting rev calls into) AND the
# network-privacy layer from zcash/librustzcash#2659 that the Tor FFI now delegates
# to. The pinned rev is the tip of that PR's branch (`feat/lwd-network-privacy`,
# based on main at 4faf8711); it carries the same crate versions as the published
# 0.24.0-rc.1 line.
# TODO: replace with a crates.io release (or a rev on librustzcash main) once
# zcash/librustzcash#2659 merges.
equihash = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "552130e7bd8b6c472d9e878fb5183913c7c0f685" }
