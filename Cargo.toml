[package]
name = "libzcashlc"
version = "2.6.0-alpha.4"
authors = [
    "Jack Grigg <thestr4d@gmail.com>",
    "Lukas Korba <lukas@tangiblecodes.com>",
    "Kris Nuttycombe<kris@nutty.land>",
    "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.14", features = ["unstable-voting-circuits"] }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.8", default-features = false }
zcash_address = { version = "0.12" }
zcash_client_backend = { version = "0.23", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.21", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.28"
zcash_proofs = "0.28"
zcash_protocol = "0.9"
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.7", features = ["prover"] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Slipstream engine (P4 FFI surface — additive dep; see CONVENTIONS containment exceptions)
slipstream-core = { path = "slipstream/core" }
tokio = { workspace = true }

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Voting
zcash_voting = { version = "0.11", default-features = false, features = [
    "client-pir",
    "client-tree-sync",
] }
zcash_keys = { version = "0.14", features = ["orchard"] }
incrementalmerkletree = { version = "0.8", default-features = false }

[features]
# Phase B / v0.4 (GPU Orchard subtree offload; renumbered from v0.3 — that slot is now the
# engine API v2 era). Forwards to slipstream-core's `gpu`
# feature (links wgpu via slipstream-gpuhash). OFF by default → the released libzcashlc
# has ZERO wgpu (B0.1, verified via cargo tree). Enable for local-FFI device builds:
#   ./Scripts/init-local-ffi.sh --gpu     (full, all slices)
#   ./Scripts/rebuild-local-ffi.sh <target> --gpu   (single slice)
# At runtime the GPU path is opt-in via the ZCASH_GPU_SUBTREE env var (dev A/B matrix);
# the capability auto-gate replaces that once calibrated.
gpu = ["slipstream-core/gpu"]

[dev-dependencies]
zcash_voting = { version = "0.11", default-features = false, features = ["test-fixtures"] }

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[workspace]
members = ["slipstream/core", "slipstream/cli", "slipstream/protogen", "slipstream/gpuhash", "slipstream/bench-ios/probe"]
resolver = "3"

[workspace.dependencies]
# Slipstream shared versions (P0-review carry-over). Root package keeps its own
# [dependencies] block; slipstream crates inherit from here.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
zcash_protocol = "0.9"
zcash_client_backend = { version = "0.23", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.21", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_keys = { version = "0.14", features = ["orchard"] }
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
orchard = { version = "0.14", features = ["unstable-voting-circuits"] }
zcash_primitives = "0.28"
transparent = { package = "zcash_transparent", version = "0.8", default-features = false }
zcash_script = "0.4"
tempfile = "3"          # dev-only usage; listed here for version unity
incrementalmerkletree = { version = "0.8", default-features = false }
shardtree = "0.6"
rayon = "1.7"
zip32 = "0.2"
zcash_note_encryption = "0.4.1"
zcash_address = "0.12"
# T10b spend-proof stub prover signatures only (already in the graph via sapling).
jubjub = "0.10"
bls12_381 = "0.8"

# Phase B (GPU Sinsemilla offload) — used ONLY by slipstream-gpuhash, behind the
# slipstream-core `gpu` feature. Never enters the default libzcashlc build. (Decision Log
# 2026-06-15, B0.1.) Versions: sinsemilla/group match the orchard 0.14 / pasta_curves 0.5
# stack already resolved by this workspace.
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
sinsemilla = "0.1"
group = "0.13"
pasta_curves = "0.5"
ff = "0.13"
