[package]
name = "libzcashlc"
version = "2.6.0"
authors = [
    "Jack Grigg <thestr4d@gmail.com>",
    "Lukas Korba <lukas@zodl.com>",
    "Kris Nuttycombe<kris@nutty.land>",
    "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.9", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.1", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.1", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.29"
zcash_proofs = "0.29"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
# Not on crates.io yet — the final pool-migration engine and its SQLite store live
# only on the `feat/pool-migration-sqlite` line of zcash/librustzcash, extended by
# the account-keyed store (librustzcash PR #2712). Direct git dependencies at the
# same rev as the [patch.crates-io] family below so the whole graph stays one
# family instance.
zcash_pool_migration_backend = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89", features = ["wallet"] }
zcash_pool_migration_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.8.0-rc.1", features = ["prover"] }
shardtree = "0.7"

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Voting
zcash_voting = "1.0"
zcash_keys = { version = "0.15.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.8", default-features = false }

[dev-dependencies]
hex = "0.4"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
voting-circuits = { git = "https://github.com/zodl-inc/voting-circuits.git", rev = "a5aae410a6fb14fcbea2f0ce3393035195e86f69" }
imt-tree = { git = "https://github.com/zodl-inc/vote-nullifier-pir.git", rev = "0dea3485429c80033e67a1ddb18ee72cc450cefb" }
zcash_voting = { git = "https://github.com/zodl-inc/zcash_voting.git", rev = "464f974865f2afa82bdac15d169168c77ecb9c74" }

# The Ironwood-era librustzcash family below is not on crates.io yet; unreleased
# sources ride this [patch.crates-io] block against the canonical repo — never
# direct git+branch dependencies — so the whole graph resolves to a single family
# instance. zcash_voting (pinned above) no longer hard-pins librustzcash itself (it
# declares crates.io versions and patches from its own root), so this block is what
# governs the rev for the entire graph.
#
# [MOB-1495 / #1806] The pinned rev is the tip of
# `michal/MOB-1455/MOB-1495-pool-migration-account-key` — `feat/pool-migration-sqlite`
# (the final pool-migration engine line, recent-main-based) plus the account-keyed
# migration store (librustzcash PR #2712, draft against that branch), which the
# multi-account wallet (software account + imported hardware-wallet account in one
# wallet database) requires. It carries `zcash_pool_migration_backend` and
# `zcash_pool_migration_sqlite` (the direct git dependencies declared above in
# [dependencies]). Bump the rev deliberately (build + OfflineTests green). When
# PR #2712 is absorbed into `feat/pool-migration-sqlite`, advance to that branch's
# rev; when the migration crates land on main, advance to a main rev; delete the
# librustzcash-family patch entries below once the family reaches a crates.io
# release.
#
# `orchard` rides the same story: the pinned librustzcash patches it to the merged
# orchard #535 commit on orchard main (ZIP 374 deferred-anchor builder + PCZT
# `Updater` setters), so this graph pins the identical rev.
orchard = { git = "https://github.com/zcash/orchard.git", rev = "fa6e5fee02ce38b54193005a35289ec705d4f5b2" }
equihash = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
f4jumble = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "1974ce536c56fb9674085fff1e171c785280ff89" }
