[package]
name = "libzcashlc"
version = "2.7.0-rc.2"
authors = [
    "Jack Grigg <thestr4d@gmail.com>",
    "Lukas Korba <lukas@tangiblecodes.com>",
    "Kris Nuttycombe<kris@nutty.land>",
    "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15" }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.4", features = [
    "lightwalletd-tonic-tls-webpki-roots",
    "orchard",
    "pczt",
    "tor",
    "transparent-inputs",
    "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.4", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = "0.10"
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.9.1", features = ["prover", "orchard", "sapling"] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting
# zcash_voting = { version = "1.0", optional = true }
# zcash_keys = { version = "0.16", features = ["orchard"] }

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[patch.crates-io]
# zcash_voting = { git = "https://github.com/valargroup/zcash_voting.git", rev = "7d39d02b297f0ce23751f2638bf403285e34e675" }
# TODO: [#1873] Remove these patches once the rc.4 release stack (pczt 0.9.1,
# zcash_client_backend 0.24.0-rc.4, zcash_client_sqlite 0.22.0-rc.4) is
# published (zcash/librustzcash#2779); they pin the release-prep revision so
# device verification exercises exactly the bits to be published, with the
# sibling crates pinned to the same revision to keep the dependency graph on a
# single source.
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "02b9dee0518017c455c9054bc4ebbe0766c821a8" }

[features]
default = []
#voting = ["dep:zcash_voting"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_voting)'] }

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true
