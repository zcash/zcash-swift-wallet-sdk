[package]
name = "libzcashlc"
version = "2.8.0-rc.2"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.15" }
pasta_curves = "0.5"
ff = "0.13"
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }
transparent = { package = "zcash_transparent", version = "0.10", default-features = false }
zcash_address = { version = "0.13" }
zcash_client_backend = { version = "0.24.0-rc.7", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "0.22.0-rc.7", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.4.1"
zcash_primitives = "0.30"
zcash_proofs = "0.30"
zcash_protocol = { version = "0.10.2", features = ["local-consensus"] }
zcash_pool_migration = { version = "0.1.0-rc.5", features = ["wallet"] }
zcash_script = "0.4"
zip32 = "0.2"
pczt = { version = "0.9", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.7"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
secrecy = "0.8"
rand = "0.8"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting — off on this line; the `voting` module is gated behind `cfg(zcash_voting)`
# (see rust/src/lib.rs). Uncomment together with the `voting` feature, the `[patch.crates-io]`
# stanza below, and orchard's `unstable-voting-circuits` feature to reinstate it.
# zcash_voting = { version = "2.0.0-rc.1", optional = true }
# zeroize = "1"

# Used by the pool-migration engine as well as (when enabled) voting, so these stay compiled.
zcash_keys = { version = "0.16.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.8", default-features = false }

# Slipstream engine — the alternative sync engine the SlipstreamSynchronizer
# drives. Consumed as a remote crate from zodl-inc/slipstream, the engine's
# home since the personal-fork era (the old PR #6 adaptations are merged
# there). Return to a release tag once one is cut with these aboard.
#
# The rev rides [patch.crates-io] below, pinned to a COMMIT HASH rather than a
# branch: a branch pin silently follows a force-push, so a build can pick up
# code nobody reviewed, whereas a stale hash fails loudly. The engine rides the
# same librustzcash rev as this package, so the graph stays a single family
# instance.
slipstream-core = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

#voting = ["dep:zcash_voting"]
# GPU-accelerated Orchard subtree building in the engine (wgpu). OFF by
# default — the released libzcashlc links zero wgpu. Enable for local device
# builds via Scripts/init-local-ffi.sh --gpu / rebuild-local-ffi.sh --gpu.

gpu = ["slipstream-core/gpu"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_voting)'] }

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# The slipstream engine has no crates.io release, so it rides a pinned rev of its canonical
# repo — a COMMIT HASH rather than a branch: a branch pin silently follows a force-push, so a
# build can pick up code nobody reviewed, whereas a stale hash fails loudly. Keep it in step with
# the librustzcash generation the versions above declare: a rev built against an older generation
# cannot resolve against them.
slipstream-core = { git = "https://github.com/zodl-inc/slipstream-internal.git", rev = "ab89ada45f2ef893a05fcefa0ead99f87d848a4e" }

## Update the `rev` value in the following lines to use a hash-pinned version of the librustzcash crates.
# INTERIM PIN (MOB-1466): the michal/tmp-next-due-plus-exact-funding-note-count branch head —
# the previous pin's rebased public next-due selection (#2927's scanned-chain-tip overdue
# re-spread and MigrationState's public read-only next-due selection,
# next_due_broadcast/next_provable — a caller reads the engine's own delivery-lane choice
# instead of recomputing it client-side) merged with the #2949 exact-funding-note-count
# follow-up. Main itself now also carries #2909 (migration transactions classified against ZIP
# 318 at store time — what the app's Activity labels key on), #2907 (engine next_* selection
# ordered by height), #2910 (a missed broadcast schedule is re-spread on resume), #2936
# (advance_migration returns satisfiability::Advance: the verified step plus the next-wake
# outlook), #2939 (the Prove step serves the whole provable set, gated on a reorg-stable anchor
# depth), #2946 (the upstream wallet adapter snapshots spendable notes — commit-time signing
# linear, not quadratic), #2943 (first-fit-decreasing preparation strategy), #2945/#2947
# (denomination follow-ups: exact funding notes preserved, quantize-once/truncation,
# shape-bounded floors), and #2916/#2915/#2911 (ZIP 318 classification written at store time;
# idempotent sent-transaction stores).
# Remove the pin (recomment the block) at the first published rc that contains all of it.
pczt = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "4d654982c4cc3d243ba0ee8f595890a19656c15a" }

# Reinstate together with the voting dependencies above:
# zcash_voting = { git = "https://github.com/valargroup/zcash_voting.git", rev = "e53e74487d31ad0f5713580fb2f0222b53ae9db8" }
