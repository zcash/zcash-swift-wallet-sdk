[package]
name = "libzcashlc"
version = "2.8.0-rc.2"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
#
# The NU7 pre-releases: zcash_protocol 0.11.0-pre.0 is the first release that knows the testnet
# NU7 activation height and consensus branch id. Pre-releases are pinned exactly, and all of them
# are `pre.0`: zcash_pool_migration and zodl-slipstream pin the `pre.0` family exactly.
orchard = { version = "0.16" }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
transparent = { package = "zcash_transparent", version = "=0.11.0-pre.0", default-features = false }
zcash_address = { version = "=0.14.0-pre.0" }
zcash_client_backend = { version = "=0.25.0-pre.0", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "=0.23.0-pre.0", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "=0.31.0-pre.0"
zcash_proofs = "=0.31.0-pre.0"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_pool_migration = { version = "=0.2.0-pre.0", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "=0.10.0-pre.0", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.2"
schemerz-rusqlite = "0.370"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.12"
tor-rtcompat = "0.35"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Shielded voting: `zcash_voting` has no release on the NU7 pre-releases above (its newest needs
# zcash_protocol ^0.10.4), so it is compiled out and `rust/src/voting.rs` stubs its C FFI surface.
# The stubs keep the FFI's free functions, which zeroize a voting hotkey's secret.
zeroize = "1"

# Used by the pool-migration engine.
zcash_keys = { version = "=0.17.0-pre.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

# ZODL Slipstream engine — the alternative sync engine the SlipstreamSynchronizer
# drives, consumed as the published crates.io release. AGPL-3.0-only (dual-licensed
# commercially by Znewco, Inc.; see Sources/ZODLSlipstream/NOTICE.md), so it is
# OPTIONAL: only the `slipstream` feature links it, and the default (MIT-clean)
# libzcashlc build carries none of it. The engine rides the same librustzcash
# generation as this package, so the graph stays a single family instance.
slipstream-core = { version = "=0.4.0-pre.0", package = "zodl-slipstream", optional = true }
# tokio is only used by the slipstream FFI surface; everything else gets its
# async runtime transitively (tor/tonic).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

# ZODL Slipstream engine (AGPL-3.0-only) and its FFI surface. OFF by default —
# the released libzcashlc.xcframework carries zero AGPL code. Enabled only for
# the libzcashlc-zodl-slipstream artifact and local builds via
# Scripts/init-local-ffi.sh --slipstream / rebuild-local-ffi.sh --slipstream.
slipstream = ["dep:slipstream-core", "dep:tokio"]

# GPU-accelerated Orchard subtree building in the engine (wgpu). OFF by
# default — the released libzcashlc links zero wgpu. A slipstream-engine
# feature, so it implies `slipstream`. Enable for local device builds via
# Scripts/init-local-ffi.sh --gpu / rebuild-local-ffi.sh --gpu.
gpu = ["slipstream", "slipstream-core?/gpu"]

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.

